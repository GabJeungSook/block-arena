name = "block-arena"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = true
keep_vars = true          # keep variables/secrets set in the Cloudflare dashboard when deploying

# The game files. The Worker runs first only for the server routes below; everything else is static.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*", "/room/*", "/s/*", "/hub", "/deletion"]

[[d1_databases]]
binding = "DB"
database_name = "block-arena"
database_id = "f707928b-e00e-415c-815d-98ba49cfe628"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Hub"]

[vars]
FB_APP_ID = "2129199354388278"   # Meta app ID (public): Facebook sharing. Facebook sign-in stays off while Google sign-in is configured
# Google sign-in: GOOGLE_CLIENT_ID goes here or in the dashboard (it's public); the secret goes in a Secret:
# npx wrangler secret put GOOGLE_CLIENT_SECRET   (or Cloudflare dashboard → Settings → Variables and Secrets → type Secret)
